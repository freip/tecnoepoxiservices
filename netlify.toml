# Netlify build configuration.
#
# The Next.js app lives in web/, so `base` points there and every other path
# below is resolved relative to it (base + publish => web/.next).
#
# `.next` is NOT a static site: publishing it directly is what produced the
# default Netlify 404. The @netlify/plugin-nextjs runtime is what turns the
# build output into the served site (static assets + serverless functions for
# SSR and the /api/quote route), so it must be declared explicitly.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
